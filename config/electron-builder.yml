appId: com.revisionreader.desktop
productName: 英语错句对照阅读器
copyright: Copyright © 2026 Revision Reader
electronVersion: 43.2.0
directories:
  app: desktop
  output: outputs/windows
files:
  - main.cjs
  - preload.cjs
  - storage.cjs
  - package.json
  - icon.ico
  - renderer/**/*
asar: true
win:
  icon: desktop/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  artifactName: Revision-Reader-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: 英语错句对照阅读器
  installerIcon: desktop/icon.ico
  uninstallerIcon: desktop/icon.ico
  installerHeaderIcon: desktop/icon.ico
  include: build/windows/installer.nsh
portable:
  artifactName: Revision-Reader-Portable-${version}.${ext}
